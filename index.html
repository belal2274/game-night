<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14161c">
<title>لعبة الإمبوستر</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#14161c;color:#f2f3f7;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
main{max-width:480px;margin:0 auto;padding:28px 20px 40px;display:flex;flex-direction:column;gap:18px;min-height:100vh}
h1{margin:0;font-size:28px}
p{margin:0;color:#aab0c0;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
.big{min-height:68px;font-size:24px;border-radius:18px;border:1px solid #3a3f52;background:#1e212b}
.big:active{background:#2a2e3b}
.tap{min-height:170px;font-size:28px;border-radius:22px;border:2px dashed #5a6180;background:transparent;width:100%}
.card{text-align:center;padding:30px 16px;border-radius:22px;background:#1e212b;border:1px solid #3a3f52}
.label{color:#aab0c0;font-size:18px;margin-bottom:8px}
.word{font-size:44px;font-weight:700;line-height:1.3;margin:0 0 6px}
.imp{color:#ff6b6b}
.ghost{background:transparent;border:1px solid #3a3f52;border-radius:12px;min-height:46px;padding:0 20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.round{font-size:15px;color:#aab0c0}
.hide{display:none!important}
.url{direction:ltr;word-break:break-all;font-size:14px;color:#aab0c0;margin-bottom:12px}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
var NAMES=['بلال','فادي','محمد'];
var CATS={"الستة بتوعنا": ["🩲 الكلوت", "🩹 الألويز", "👙 البكيني", "🦿 الصناعي", "🐷 الخنزير", "🐶 الكلب"], "أكل": ["🍝 كشري", "🥘 فول", "🧆 طعمية", "🥬 ملوخية", "🫑 محشي", "🥧 فطيرة", "🍢 كباب", "🌯 شاورما", "🍕 بيتزا", "🍟 بطاطس", "🍮 أم علي", "🍯 كنافة", "🍚 رز بلبن", "🍰 بسبوسة", "🐟 سمك"], "أفلام": ["🕴️ الزعيم", "🤪 اللمبي", "إسماعيلية رايح جاي", "الإرهاب والكباب", "🐘 الفيل الأزرق", "🦁 الأسد الملك", "🐭 توم وجيري", "🚢 تيتانيك", "🧙 هاري بوتر", "🕷️ سبايدرمان", "☀️ شمس", "عسكر في المعسكر", "صعيدي في الجامعة الأمريكية", "🏝️ الجزيرة", "ولاد رزق"], "حيوانات": ["🦁 أسد", "🐘 فيل", "🦒 زرافة", "🐪 جمل", "🐴 حصان", "🐱 قطة", "🐊 تمساح", "🐍 ثعبان", "🐔 دجاجة", "🐄 بقرة", "🐑 خروف", "🐴 حمار", "🐵 قرد", "🐯 نمر", "🐻 دب"], "جمادات": ["🪑 كرسي", "🧊 تلاجة", "📱 تليفون", "🔑 مفتاح", "🪞 مراية", "🌀 مروحة", "🔩 مسمار", "🛏️ سرير", "⏰ ساعة", "👜 شنطة", "✂️ مقص", "🥄 ملعقة", "👓 نضارة", "🪥 فرشاة أسنان", "📺 تلفزيون", "🩴 شبشب"], "نباتات": ["🌴 نخلة", "🌹 وردة", "🌵 صبار", "🌿 نعناع", "🌼 ياسمين", "🌻 عباد الشمس", "🧅 بصل", "🍅 طماطم", "🥕 جزر", "🍌 موز", "🍊 برتقال", "🥭 مانجا", "🍉 بطيخ", "🍇 عنب", "🫒 زيتون"]};var CN=Object.keys(CATS);
var SALT='de42263721f451b529654273';
function h(str){var a=1779033703^str.length,b=3144134277,c=1013904242,d=2773480762;for(var i=0;i<str.length;i++){var k=str.charCodeAt(i);a=b^Math.imul(a^k,597399067);b=c^Math.imul(b^k,2869860233);c=d^Math.imul(c^k,951274213);d=a^Math.imul(d^k,2716044179)}a=Math.imul(c^(a>>>18),597399067);b=Math.imul(d^(b>>>22),2869860233);return (a^b^c^d)>>>0}
function room(c,seed){var W=CATS[CN[c]];return {imp:h(SALT+':i:'+seed)%3,word:W[h(SALT+':w:'+seed)%W.length]}}
window.__room=room;
function rnd(){var a=new Uint32Array(3);(window.crypto||window.msCrypto).getRandomValues(a);return Array.prototype.map.call(a,function(x){return x.toString(36)}).join('').slice(0,12)}
function parseHash(){var m=/^#(\d)-([a-z0-9]{6,16})$/.exec(location.hash);if(!m)return null;var c=+m[1];if(c>=CN.length)return null;return {c:c,seed:m[2]}}
var app=document.getElementById('app');var shown=false;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function getName(seed){try{var v=localStorage.getItem('imp.n.'+seed);return v==null?null:+v}catch(e){return null}}
function setName(seed,n){try{if(n==null)localStorage.removeItem('imp.n.'+seed);else localStorage.setItem('imp.n.'+seed,String(n))}catch(e){}}
function newRoom(c){location.hash='#'+c+'-'+rnd();shown=false}
function shareBox(){
  var box=el('div','card');box.appendChild(el('div','label','لينك الروم، ابعته للباقي'));
  var u=el('div','url',location.href);box.appendChild(u);
  var b=el('button','ghost','نسخ اللينك');
  b.onclick=function(){var done=function(){b.textContent='اتنسخ'};
    if(navigator.share){navigator.share({url:location.href}).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(location.href).then(done,function(){})}
    else{var r=document.createRange();r.selectNode(u);getSelection().removeAllRanges();getSelection().addRange(r);try{document.execCommand('copy');done()}catch(e){}}};
  box.appendChild(b);return box}
function draw(){
  app.innerHTML='';
  var R=parseHash();
  if(!R){
    app.appendChild(el('h1',0,'لعبة الإمبوستر'));
    app.appendChild(el('p',0,'اعمل روم جديد: اختار القسم، وابعت اللينك للباقي.'));
    CN.forEach(function(n,i){var b=el('button','big',n);b.onclick=function(){newRoom(i)};app.appendChild(b)});
    return}
  var name=getName(R.seed);
  if(name===null){
    app.appendChild(el('h1',0,'اختار اسمك'));
    app.appendChild(el('p',0,'القسم: '+CN[R.c]));
    NAMES.forEach(function(n,i){var b=el('button','big','أنا '+n);b.onclick=function(){setName(R.seed,i);shown=false;draw()};app.appendChild(b)});
    app.appendChild(shareBox());
    var nb=el('button','ghost','روم جديد');nb.onclick=function(){location.hash='';};app.appendChild(nb);
    return}
  var X=room(R.c,R.seed),isImp=X.imp===name;
  app.appendChild(el('h1',0,'إنت '+NAMES[name]));
  app.appendChild(el('p',0,'ده دورك السري. متوريش الشاشة لحد. القسم: '+CN[R.c]));
  if(!shown){var t=el('button','tap','اضغط عشان تشوف');t.onclick=function(){shown=true;draw()};app.appendChild(t)}
  else{var c=el('div','card');
    c.appendChild(el('div','label',isImp?'إنت':'الكلمة بتاعتك'));
    c.appendChild(el('div','word'+(isImp?' imp':''),isImp?'الإمبوستر!':X.word));
    var hb=el('button','ghost','إخفاء');hb.onclick=function(){shown=false;draw()};c.appendChild(hb);app.appendChild(c)}
  app.appendChild(el('p',0,'اسألوا بعض في المكالمة من غير ما تقولوا الكلمة نفسها.'));
  var again=el('button','big','روم جديد بنفس القسم');again.onclick=function(){newRoom(R.c)};app.appendChild(again);
  app.appendChild(shareBox());
  var row=el('div','row');
  var hm=el('button','ghost','روم جديد بقسم تاني');hm.onclick=function(){location.hash=''};
  var cn=el('button','ghost','غيّر اسمي');cn.onclick=function(){setName(R.seed,null);shown=false;draw()};
  row.appendChild(hm);row.appendChild(cn);app.appendChild(row);
}
window.addEventListener('hashchange',function(){shown=false;draw()});
draw();
})();
</script>
</body>
</html>
